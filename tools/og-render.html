<!DOCTYPE html>
<!-- Source for assets/og.png (1200x630). Regenerate with tools/render-og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0C0C0D; width: 1200px; height: 630px; overflow: hidden; }
  .card { width: 1200px; height: 630px; display: grid; grid-template-rows: auto 1fr auto; color: #ECEAE4; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, transparent 2px 5px), #0C0C0D; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 26px 64px; border-bottom: 1px solid #2A2A2C; }
  .word { font: 400 30px "Archivo Black", sans-serif; letter-spacing: -.02em; text-transform: uppercase; }
  .word span { color: #D8FF3C; }
  .status { display: flex; gap: 10px; align-items: center; border: 1px solid #2A2A2C; color: #D8FF3C; font: 500 15px "JetBrains Mono", monospace; letter-spacing: .08em; padding: 9px 16px; }
  .status i { width: 10px; height: 10px; background: #D8FF3C; }
  .mid { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: end; padding: 40px 64px 44px; }
  .kick { font: 500 17px "JetBrains Mono", monospace; letter-spacing: .08em; color: #D8FF3C; margin-bottom: 26px; }
  h1 { font: 400 98px/.86 "Archivo Black", sans-serif; letter-spacing: -.045em; text-transform: uppercase; }
  h1 span { color: #D8FF3C; }
  .verdict { display: flex; flex-direction: column; gap: 12px; font: 700 18px "JetBrains Mono", monospace; letter-spacing: .1em; text-align: center; width: 190px; }
  .verdict .lbl { color: #8A8A86; font-weight: 500; font-size: 14px; text-align: left; }
  .verdict b { display: block; padding: 12px 0; }
  .act { background: #D8FF3C; color: #0C0C0D; }
  .watch { border: 2px solid #ECEAE4; }
  .skip { background: #FF3B2F; color: #0C0C0D; }
  .foot { background: #D8FF3C; color: #0C0C0D; display: flex; justify-content: space-between; padding: 22px 64px; font: 700 16px "JetBrains Mono", monospace; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="word">AlphaHunt<span>.ing</span></span><span class="status"><i></i>PRIVATE · INVITE ONLY</span></div>
  <div class="mid">
    <div>
      <p class="kick">[ A PRIVATE CRYPTO INTEL CIRCLE ]</p>
      <h1>Spot it early.<br>Act on it <span>every day.</span></h1>
    </div>
    <div class="verdict"><span class="lbl">VERDICT</span><b class="act">ACT</b><b class="watch">WATCH</b><b class="skip">SKIP</b></div>
  </div>
  <div class="foot"><span>MEMBERS ONLY</span><span>YOU STILL SIGN EVERY TRADE</span><span>NOT FINANCIAL ADVICE</span></div>
</div>
</body>
</html>
