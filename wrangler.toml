# alphahunt.ing on Cloudflare: a Worker that only serves static assets.
# No script runs; Cloudflare serves dist/ and applies _headers and _redirects.
# Build and deploy with tools/deploy.sh, never `wrangler deploy` from a working copy.
name = "alphahunt-website"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Custom domains: alphahunt.ing is a zone on the Cloudflare account that owns alphahunt.ing; the deploy
# attaches both hostnames itself (Cloudflare makes the DNS records and certs).

[[routes]]
pattern = "alphahunt.ing"
custom_domain = true

[[routes]]
pattern = "www.alphahunt.ing"
custom_domain = true
